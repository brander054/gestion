<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <h1>📦 Gestión de Inventario</h1>
        <p>Plataforma Segura de Administración</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Agregar Producto</h2>
            <form id="productForm" class="product-form">
                <div class="form-group">
                    <label for="productName">Nombre del Producto:</label>
                    <input type="text" id="productName" placeholder="Ej. Laptop HP" required>
                    <span class="error-message" id="nameError"></span>
                </div>
                
                <div class="form-group">
                    <label for="productQuantity">Cantidad:</label>
                    <input type="number" id="productQuantity" min="1" placeholder="Ej. 10" required>
                    <span class="error-message" id="quantityError"></span>
                </div>

                <div class="form-group">
                    <label for="productPrice">Precio ($):</label>
                    <input type="number" id="productPrice" step="0.01" min="0.01" placeholder="Ej. 500.50" required>
                    <span class="error-message" id="priceError"></span>
                </div>

                <button type="submit" class="btn-submit">Guardar Producto</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Inventario Actual</h2>
            <div id="productList" class="product-grid">
                <p class="loading-msg">Cargando productos...</p>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
